name: Build Website

on:
  push:
    branches:
      - main
  workflow_dispatch: # manual "Run workflow" button

concurrency:
  group: pages-deploy
  cancel-in-progress: true

env:
  # Pinned on purpose: "latest" broke the build when Hugo removed the tweet shortcode.
  HUGO_VERSION: '0.168.0'

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.repository == 'JordanTheITGuy/isconfigmgrdead.com-hugo'
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true # PaperMod theme
          fetch-depth: 0   # full history for .GitInfo / .Lastmod

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Build
        run: hugo --minify

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
          external_repository: JordanTheITGuy/isconfigmgrdead.com
          publish_dir: ./public
          publish_branch: main
          keep_files: false
          cname: isconfigmgrdead.com
